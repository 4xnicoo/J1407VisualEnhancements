@Scatterer_atmosphere:FOR[J1407System]
{
    Atmo
    {
        name = Khepri
        Tag = KhepriPlanet
        atmosphereStartRadiusScale = 1
        // Scale heights (thinner atmosphere)
        HR = 4.8        // Rayleigh - lower = thinner
        HM = 1.2        // Mie - lower = less haze
        // Rayleigh scattering (sky color)
        // Reduced values = lighter/thinner atmosphere
        m_betaR = 0.016,0.024,0.050
        // Mie scattering (haze) - reduced for clearer atmosphere
        BETA_MSca = 0.0025,0.0025,0.0025
        m_mieG = 0.70
        averageGroundReflectance = 0.18
        multipleScattering = True
        godrayStrength = 0.5
        // Horizon / rim lighting
        flattenScaledSpaceMesh = 0.12
        rimBlend = 18
        rimpower = 400
        // Ocean specular
        specR = 18
        specG = 20
        specB = 22
        shininess = 65
        // Cloud + volumetrics integration - increased for brighter clouds
        cloudColorMultiplier = 1.4
        cloudScatteringMultiplier = 0.35
        cloudSkyIrradianceMultiplier = 0.15
        volumetricsColorMultiplier = 1.3
        EVEIntegration_preserveCloudColors = False
        adjustScaledTexture = False
        scaledLandBrightnessAdjust = 1.05
        scaledLandContrastAdjust = 1
        scaledLandSaturationAdjust = 1
        scaledOceanBrightnessAdjust = 1
        scaledOceanContrastAdjust = 1
        scaledOceanSaturationAdjust = 1
        configPoints
        {
            Item
            {
                altitude = 0
                skyExposure = 0.25
                skyAlpha = 0.95
                skyExtinctionTint = 1
                scatteringExposure = 0.28
                extinctionThickness = 0.85
                postProcessAlpha = 1
                postProcessDepth = 0
                extinctionTint = 0
            }
        }
    }
}